<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean, modern logo for V&M Personal Finance -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="96" cy="96" r="88" fill="url(#blueGradient)"/>

  <!-- V Letter -->
  <path d="M 50 60 L 68 120 L 86 60"
        stroke="white" stroke-width="10" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M Letter -->
  <path d="M 96 60 L 96 120 M 96 60 L 114 90 L 132 60 L 132 120"
        stroke="white" stroke-width="10" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dollar sign accent -->
  <circle cx="150" cy="96" r="24" fill="none" stroke="#93C5FD" stroke-width="6" opacity="0.6"/>
  <text x="150" y="107" font-family="Arial, sans-serif" font-size="32"
        font-weight="bold" fill="#93C5FD" text-anchor="middle">$</text>
</svg>
